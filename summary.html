<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Lock In</title>
  <link rel="stylesheet" href="assets/theme.css" />
  <link rel="stylesheet" href="summary.css" />
</head>
<body>
  <div class="page">
    <header class="head">
      <div class="head__top">
        <span class="wordmark">Lock In</span>
        <div class="head__tools">
          <div class="langs" id="langs"></div>
          <button class="btn btn--quiet" id="resetBtn" type="button" data-i18n="summaryReset"></button>
        </div>
      </div>
      <h1 class="head__title" data-i18n="summaryHeading"></h1>
      <p class="head__sub" id="headSub"></p>
    </header>

    <section class="stats" id="stats"></section>

    <section class="panel card">
      <div class="card__head">
        <h2 class="card__title" data-i18n="summaryWeekTitle"></h2>
        <span class="eyebrow" id="weekLegend"></span>
      </div>
      <div class="graph" id="graph"></div>
      <p class="empty" id="graphEmpty" data-i18n="summaryNoData" hidden></p>
    </section>

    <section class="panel card">
      <div class="card__head">
        <h2 class="card__title" data-i18n="summaryOffendersTitle"></h2>
        <button class="btn btn--quiet" id="clearCountersBtn" type="button" data-i18n="summaryClearCounters"></button>
      </div>
      <ul class="ranks" id="ranks"></ul>
      <p class="empty" id="ranksEmpty" data-i18n="summaryNoAttempts" hidden></p>
    </section>

    <section class="panel card">
      <div class="card__head">
        <h2 class="card__title" data-i18n="summaryHistoryTitle"></h2>
      </div>
      <ul class="sessions" id="sessions"></ul>
      <p class="empty" id="sessionsEmpty" data-i18n="summaryNoHistory" hidden></p>
    </section>

    <section class="panel card" id="settingsCard">
      <div class="card__head">
        <h2 class="card__title" data-i18n="summarySettingsTitle"></h2>
        <div class="backup-actions">
          <button class="btn btn--sm" id="exportBtn" type="button" data-i18n="summaryExport"></button>
          <button class="btn btn--sm" id="importBtn" type="button" data-i18n="summaryImport"></button>
          <input id="importInput" type="file" accept="application/json,.json" hidden />
        </div>
      </div>

      <div class="settings-grid">
        <label class="setting">
          <span class="eyebrow" data-i18n="summaryGoalLabel"></span>
          <span class="setting__row">
            <input class="field setting__num" id="goalInput" type="number" min="0" max="1440" step="5" inputmode="numeric" />
            <span class="eyebrow" data-i18n="unitMinAbbrev"></span>
          </span>
        </label>

        <div class="setting">
          <label class="setting__check">
            <input id="scheduleEnabled" type="checkbox" />
            <span class="eyebrow" data-i18n="summaryScheduleLabel"></span>
          </label>
          <div class="setting__row">
            <input class="field setting__time" id="scheduleStart" type="time" />
            <span class="eyebrow">–</span>
            <input class="field setting__time" id="scheduleEnd" type="time" />
          </div>
          <div class="weekdays" id="scheduleDays" role="group"></div>
        </div>
      </div>
    </section>

    <section class="panel card" id="supportCard">
      <div class="card__head">
        <h2 class="card__title" data-i18n="summarySupportTitle"></h2>
      </div>
      <div class="support" id="supportPanel"></div>
    </section>
  </div>

  <script type="module" src="summary.js"></script>
</body>
</html>
